name: Android Debug Build

on:
  push:
    branches: [main, feature/capacitor-android]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'index.html'
      - 'art-ex20.*'
      - 'ui-theme.css'
      - 'vfx/**'
      - 'mobile/**'
      - 'package*.json'
      - 'scripts/build-mobile.mjs'
      - 'scripts/late-game-smoke.mjs'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'MOBILE_RELEASE.md'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Test game and package Android assets
        run: |
          npm run check:mobile
          npm run check:purchase-verifier
          npm run sync:android:preview
          test "$(find android/app/src/main/assets/public/assets -type f | wc -l)" -gt 30
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Package release web assets without test ads
        run: |
          npm run sync:android
          npm run check:packaged-art
      - name: Build unsigned release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sprout-full-art-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sprout-android-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
