name: One-shot Pixel Polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-visual-polish-once.mjs'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic visual patch
        run: node scripts/apply-visual-polish-once.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Static check
        run: node scripts/static-check.mjs --out artifacts/static.json
      - name: Browser runtime audit
        run: node scripts/runtime-audit.mjs --out artifacts/runtime.json
      - name: Balance tests
        run: node scripts/balance-sim.mjs --out artifacts/balance.json
      - name: Commit verified polish
        run: |
          git config user.name 'sprout-polish[bot]'
          git config user.email 'sprout-polish[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No visual change'; exit 1; }
          git commit -m 'Polish battle sprite pixel scaling'
          git push origin HEAD:main
